global
    log stdout format raw local0
    maxconn 4096

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    timeout connect 5s
    timeout client  30s
    timeout server  30s

frontend http_front
    bind *:8100
    default_backend http_back

backend http_back
    balance roundrobin
    option httpchk GET /ping
    server server1 server-1:8100 check
    server server2 server-2:8100 check
    server server3 server-3:8100 check

listen stats
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 10s
