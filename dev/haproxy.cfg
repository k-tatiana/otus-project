global
    # Multi-threading settings
    nbthread 10            # Number of threads (one per CPU core)
    maxconn 50000          # Max connections (5000 per core)
    ulimit-n 100000        # Max file descriptors
    log stdout format raw local0 info

    # Thread binding (CPU affinity)
    cpu-map auto:1-10 0-9  # Map threads to CPU cores

    # Performance tuning
    tune.bufsize 32768     # Buffer size
    tune.maxrewrite 1024   # Header rewrite buffer size

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    option  http-server-close
    option  forwardfor

    # Timeouts
    timeout connect 5s
    timeout client  30s
    timeout server  30s
    timeout queue   5s      # Maximum time in queue

    # Performance options
    option  logasap
    option  tcp-smart-accept
    option  tcp-smart-connect

    # Connection handling
    backlog 10000
    maxconn 3000            # Max concurrent connections per process

frontend http_front
    bind *:8100
    # Tracking response time
    stick-table type ip size 100k store gpc0,conn_rate(60s),http_req_rate(60s),http_err_rate(60s)
    http-request track-sc0 src

    # Logging format with response time
    log-format "%ci:%cp [%tr] %ft %b/%s %TR/%Tw/%Tc/%Tr/%Ta %ST %B %CC %CS %tsc %ac/%fc/%bc/%sc/%rc %sq/%bq %hr %hs %{+Q}r"
    
    # Capture response time headers
    capture request header User-Agent len 100
    capture request header Host len 40
    capture request header X-Forwarded-For len 50
    capture response header Content-Length len 10
    
    # Route debug endpoints to debug backend
    acl is_debug path_beg /debug/pprof
    use_backend debug_back if is_debug

    default_backend http_back

backend debug_back
    balance roundrobin
    option httpchk GET /ping
    # Longer timeouts for pprof endpoints
    timeout server 5m    # 5 minutes for long profiling requests
    timeout connect 5s
    timeout client 5m
    server server1 server-1:8100 check
    server server2 server-2:8100 check
    server server3 server-3:8100 check

backend http_back
    balance roundrobin
    option httpchk GET /ping
    http-check expect status 200
    option log-health-checks
    server server1 server-1:8100 check
    server server2 server-2:8100 check
    server server3 server-3:8100 check

frontend stats_front
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 10s
    stats show-legends
    stats show-node
